<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WDPP Test Cases</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🧪 WDPP Test Cases</h1>
    <p class="subtitle">17 cases — verify each element gets correct API provenance</p>
    <div id="stats">
      <span id="stat-total">Total: 0</span>
      <span id="stat-passed">✅ Passed: 0</span>
      <span id="stat-failed">❌ Failed: 0</span>
    </div>
    <button id="run-tests">Run All Tests</button>
  </header>

  <main id="test-grid">
    <!-- Each test case is a card -->
  </main>

  <div id="results-panel">
    <h3>📊 Results</h3>
    <pre id="results-log">Click "Run All Tests" to start.</pre>
  </div>

  <script type="module" src="cases.js"></script>
</body>
</html>
