<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Web Data Provenance — Demo</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/1.6 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; background: #fafbfc; color: #1a1a1a; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { color: #666; margin: 0; }
  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; max-width: 520px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 18px; margin: 0 0 12px; }
  .profile { display: flex; gap: 16px; align-items: flex-start; }
  .profile img { width: 48px; height: 48px; border-radius: 50%; }
  .info > * { margin: 2px 0; }
  .info h3 { font-size: 16px; margin: 0; }
  .vip { display: inline-block; background: #ffd700; color: #5a4500; font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
  .level { color: #06c; font-family: monospace; }
  ul { margin: 12px 0 0; padding-left: 20px; }
  li { margin: 4px 0; }
  footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; color: #999; font-size: 12px; }
  .hint { margin-top: 16px; padding: 8px 12px; background: #eef4ff; border-radius: 4px; font-size: 12px; color: #06c; }
</style>
</head>
<body>
<header>
  <h1>🌐 Web Data Provenance</h1>
  <p>点任意带彩色边框的元素,看它由哪个 API 字段算出来的。Ctrl+Shift+P 切换高亮。</p>
</header>
<div id="app"></div>
<div class="hint">蓝色实线=精确 · 橙色虚线=碰撞 · 绿色=控制边 · 红色点线=熔断</div>
<script type="module" src="./demo.js"></script>
</body>
</html>
